name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The library leans hard on C++20 constexpr evaluation and template
  # instantiation limits — exactly where compilers diverge most — so it is
  # built with both major toolchains rather than clang alone.
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang++-18
            name: clang-18
          - compiler: g++-13
            name: gcc-13

    name: build-and-test (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build python3 wget lsb-release software-properties-common gnupg g++-13
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y clang-18

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build dist header
        run: cmake --build build --target dist

      - name: Check dist header is up to date
        run: |
          python3 scripts/amalgamate.py \
            include/sparsemat/api/sparsemat.h \
            dist/sparsemat.h.new \
            include
          diff dist/sparsemat.h dist/sparsemat.h.new || \
            (echo "dist/sparsemat.h is out of date — run cmake --build build --target dist" && exit 1)

  # clang-tidy only. Formatting is deliberately not checked here: the exact
  # output of clang-format varies between patch releases, so a runner whose
  # clang-format differs from the contributor's fails the build on diffs nobody
  # introduced. scripts/pre-commit still formats every staged file locally,
  # which is where formatting is enforced.
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build python3 wget lsb-release software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y clang-18 clang-tidy-18

      - name: Configure (for compile_commands.json)
        run: cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++-18

      - name: clang-tidy
        run: |
          clang-tidy-18 -p build --header-filter='.*/include/sparsemat/.*' \
            tests/test_sparsemat.cpp examples/demo.cpp examples/kalman.cpp

  # --coverage and the sanitizers both need their own build: the former
  # disables optimization, and the latter changes codegen.
  sanitizers:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build python3

      - name: Configure and run with ASan/UBSan
        run: |
          cmake -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          cmake --build build-asan
          ctest --test-dir build-asan --output-on-failure

  coverage:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build python3 python3-pip
          pip install --break-system-packages gcovr

      - name: Configure and generate coverage
        run: |
          cmake -B build-coverage -G Ninja -DSPARSEMAT_ENABLE_COVERAGE=ON
          cmake --build build-coverage --target coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/coverage

  # The in-tree build never exercises find_package(): examples/link reuses the
  # existing sparsemat::sparsemat target when built via add_subdirectory, so the
  # installed-package path — the exported targets file, the config file, the
  # install-interface include dir — is only covered by installing for real and
  # configuring a consumer against the prefix. That is exactly what a release
  # most easily breaks, and nothing else in this workflow would notice.
  install-consumer:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build python3

      - name: Configure and install to a prefix
        run: |
          cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          cmake --build build
          cmake --install build

      - name: Build examples/link standalone against the installed package
        run: |
          cmake -S examples/link -B build-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH=$PWD/prefix
          cmake --build build-consumer
          ./build-consumer/link_example

  cuda-build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build python3 nvidia-cuda-toolkit

      # Every SparseMat operation is marked SPARSEMAT_HD (__host__ __device__).
      # sparsemat_tests_gpu compiles tests/test_sparsemat.cpp — the same test
      # source the CPU job runs — through nvcc and launches a kernel that
      # calls its run_all_tests(), so this proves those SPARSEMAT_HD
      # operations both compile for the device and run correctly on it, not
      # just something that happens to compile with g++/clang. No GPU is
      # available on this runner, so CMAKE_CUDA_ARCHITECTURES falls back from
      # "native" (nvcc still compiles for a default architecture) and the
      # test detects the missing device at runtime and reports itself as
      # skipped rather than failed.
      - name: Configure
        run: cmake -B build-cuda -G Ninja -DSPARSEMAT_ENABLE_CUDA=ON -DSPARSEMAT_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-cuda

      - name: Test
        run: ctest --test-dir build-cuda --output-on-failure
